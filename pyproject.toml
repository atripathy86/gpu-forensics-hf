[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-forensics-hf"
version = "0.2.0"
description = "GPU initialization-layout forensics for Hugging Face model weights"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.scripts]
gpu-forensics = "gpu_forensics.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["gpuid", "fetch"]
packages = ["gpu_forensics", "gpu_forensics.search"]

[tool.setuptools.package-data]
"gpu_forensics.search" = ["*.c", "*.cu"]

[tool.ruff]
line-length = 120
extend-exclude = ["gpuid.py", "fetch.py", "replay.py", "gpu_check.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = ["network: requires access to huggingface.co"]
addopts = "-m 'not network'"
